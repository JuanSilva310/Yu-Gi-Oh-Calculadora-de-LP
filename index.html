<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu-Gi-Oh LP HUD</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;height:100vh;background:linear-gradient(#48c9b0,#1f3a5f);color:#eafff3;overflow:hidden}
.top-bar{
  height:10vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 4vw;
}

.site-logo{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex:1;
  min-width:0;
}

.site-logo img{
  max-width:120px;
  max-height:7vh;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.top-controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.top-bar .icon{
  width:11vw;
  height:11vw;
  max-width:48px;
  max-height:48px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex-shrink:0;
}

.top-time{
  font-size:7vw;
  font-weight:bold;
  flex-shrink:0;
}
.field{
  height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:1vh 0;
}
.player{
  width:92vw;
min-height:38vh;
  margin:0 auto;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  position:relative;
}
.character-area{
  width:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;
}
.player-panel{
  width:100%;
  background:#0f6b66;
  border-radius:24px;
  padding:3vw;

  display:flex;
  justify-content:space-between;
  align-items:center;
}
.player.bottom{
  flex-direction:column;
transform: translateY(-4vh);
}
.player.top .character-area{
  order: 1;
}

.player.top .player-panel{
  order: 2;
}

.player.bottom .character-area{
  order: 1;
}

.player.bottom .player-panel{
  order: 2;
}
.info{display:flex;flex-direction:column;gap:0.5vh}
.name{font-size:5vw}
.lp-row{display:flex;align-items:baseline;gap:1vw}
.lp-label{font-size:4vw}
.lp-value{font-size:10vw;font-weight:bold;line-height:1}
.controls{display:flex;gap:2vw}
.controls button{width:10vw;height:10vw;max-width:48px;max-height:48px;border:none;border-radius:12px;font-size:6vw;font-weight:bold}
.turn-time{display:flex;align-items:center;gap:2vw;font-size:4vw}
.turn-btn{width:8vw;height:8vw;border-radius:50%;border:none;font-size:4vw}
.plus{background:#eafff3}.minus{background:#ffd1c1}.div{background:#ffe28a}.mult{background:#d8c9ff}
.portrait{
  width:36vw;
  height:36vw;

  max-width:210px;
  max-height:210px;

  overflow:visible;
  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;
}
.portrait img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}


/* =======================
   BOTÃO ALTER EGO
   ETAPA 2A — VISUAL
======================= */

.alter-ego-button{

  position:absolute;

  width:52px;
  height:52px;

  border:none;
  border-radius:50%;

  background:#f39c12;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 3px 8px rgba(0,0,0,.35);

  z-index:10;

  padding:0;

}


/*
  PLAYER 2

  O botão fica visualmente
  à direita do retrato.
*/

.player.bottom .alter-ego-button{

  left:calc(50% + 18vw + 2vw);

  top:calc(50% + 2vh);

  transform:translateY(-50%);

}

.player.top .alter-ego-button{

  left:calc(50% + 18vw  + 2vw );

  top:50%;

  transform:translateY(-50%);

}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center}
.calc{background:#0f6b66;padding:20px;border-radius:16px;text-align:center}
.calc input{font-size:24px;width:160px;text-align:center;margin-bottom:10px}
.calc button{font-size:18px;margin:4px;padding:6px 14px}
.menu {
  position: fixed;
  inset: 0;
  background: #111;
  color: white;
  padding: 16px;
  z-index: 999;
}

.hidden {
  display: none;
}

.card-row {
  display: flex;
  overflow-x: auto;
  gap: 12px;
  margin-bottom: 20px;
}

.card {
  min-width: 120px;
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
}

.card.selected {
  border-color: #2196f3; /* AZUL DA SELEÇÃO */
}

.card img {
  width: 100%;
  height: 100px;
  object-fit: cover;
}
.player.top{
  transform:rotate(180deg);
}
/* =======================
   TELA DE BOAS-VINDAS
======================= */

.welcome-screen{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.75);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:9999;
}

.welcome-box{
  background:#0f6b66;

  padding:30px;

  border-radius:20px;

  text-align:center;

  min-width:250px;
}

.welcome-message{
  font-size:24px;
  font-weight:bold;

  margin-bottom:20px;
}

#welcomeBtn{
  border:none;

  border-radius:12px;

  padding:10px 35px;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;
}


/* =======================
   PAINEL DE PERSONAGENS
======================= */

.character-menu{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.75);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:9998;
}

.character-box{
  width:min(90vw,500px);
  max-height:85vh;

  background:#0f6b66;

  border-radius:20px;

  padding:20px;

  display:flex;
  flex-direction:column;

  gap:15px;
}

/* =======================
   PAINEL EXTRAS
======================= */

.extras-menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9997;
}

.extras-box{
  width:min(90vw,500px);
  max-height:85vh;
  background:#0f6b66;
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.extras-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.extras-box button:active{
  transform:scale(.98);
}

/* =======================
   PAINEL EVENTOS
======================= */

.events-menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9996;
}

.events-box{
  width:min(90vw,500px);
  max-height:85vh;
  background:#0f6b66;
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

#eventsList{
  display:flex;
  flex-direction:column;
  gap:15px;
  overflow-y:auto;
}

.events-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* =======================
   PAINEL DETALHES EVENTO
======================= */

.event-details-menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9995;
}

.event-details-box{
  width:min(92vw,560px);
  max-height:90vh;

  background:#0f6b66;
  border-radius:20px;

  padding:18px;

  display:flex;
  flex-direction:column;

  gap:14px;

  overflow-y:auto;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.event-details-overlay{
  background:transparent;

  border-radius:16px;

  padding:14px;

  display:flex;
  flex-direction:column;

  gap:14px;
}

.event-details-banner{
  width:100%;

  max-height:220px;

  object-fit:contain;

  display:block;

  border-radius:14px;
}

.event-details-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  border-bottom:1px solid rgba(255,255,255,.25);

  padding-bottom:10px;
}

.event-details-name{
  font-size:24px;
  font-weight:bold;
}

.event-details-id{
  font-size:15px;
  font-weight:bold;

  white-space:nowrap;

  background:rgba(0,0,0,.25);

  padding:6px 9px;

  border-radius:8px;
}

.event-details-section-title{
  font-size:20px;
  font-weight:bold;

  text-align:center;

  margin-top:4px;
}

.event-details-history{
  font-size:16px;
  line-height:1.5;

  text-align:justify;

  background:rgba(0,0,0,.18);

  padding:12px;

  border-radius:12px;
}

.event-missions-list{
  display:flex;
  flex-direction:column;

  gap:10px;
}

.event-mission{
  background:rgba(0,0,0,.20);

  border-radius:12px;

  padding:12px;

  display:flex;
  flex-direction:column;

  gap:7px;
}

.event-mission-description{
  font-size:16px;
  line-height:1.35;
}

.event-mission-progress{
  font-size:14px;
  font-weight:bold;

  text-align:right;

  opacity:.9;
}

.event-rewards-list{
  display:flex;
  flex-direction:column;

  gap:8px;
}

.event-reward{
  background:rgba(0,0,0,.20);

  border-radius:10px;

  padding:10px;

  font-size:15px;
}

.event-redeem-warning{
  background:rgba(255,193,7,.18);

  border:1px solid rgba(255,193,7,.45);

  border-radius:12px;

  padding:12px;

  font-size:14px;

  line-height:1.4;
}

.event-reward-status{
  margin-top:10px;
  font-size:14px;
  font-weight:bold;
  text-align:center;
  opacity:.9;
}

.event-reward-collect-button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.event-reward-collect-button:active{
  transform:scale(.98);
}

#eventDetailsCloseButton{
  width:100%;

  padding:14px;

  border:none;

  border-radius:12px;

  background:rgba(255,255,255,.15);

  color:#fff;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;
}

#eventDetailsCloseButton:active{
  transform:scale(.98);
}

.events-box button:active{
  transform:scale(.98);
}

.character-tabs{
  display:flex;
  gap:10px;
}

.character-tab{
  flex:1;

  border:none;
  border-radius:12px;

  padding:12px;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;
}

.character-tab.active-p1{
  background:#3fa9ff;
}

.character-tab.active-p2{
  background:#4caf50;
}

.character-list{
  display:flex;
  flex-direction:column;

  gap:8px;

  overflow-y:auto;

  max-height:50vh;
}

.character-option{
  border:none;

  border-radius:10px;

  padding:14px;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  background:#ffffff;
  color:#111;
}

.character-option.selected-p1{
  background:#3fa9ff;
  color:white;
}

.character-option.selected-p2{
  background:#4caf50;
  color:white;
}

.character-option.disabled{
  opacity:.45;

  cursor:not-allowed;
}

.character-actions{
  display:flex;
  gap:10px;
}

.character-actions button{
  flex:1;

  border:none;
  border-radius:10px;

  padding:12px;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}


/* =======================
   RESULTADO DO DUELO
======================= */

.duel-result{
  position:fixed;

  left:50%;
  top:57%;

  transform:translate(-50%, -50%);

  z-index:100;

  color:white;

  -webkit-text-stroke:2px black;

  font-size:clamp(24px, 7vw, 48px);

  font-weight:bold;

  text-align:center;

  pointer-events:none;
}

/* =========================
   ALTER EGO — 3B VISUAL
   ========================= */

.portrait{
  position:relative;
}

.alter-ego-visual{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:20;
  pointer-events:none;
}

.alter-ego-visual-target,
.alter-ego-visual-sprite{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  display:block;
  pointer-events:none;
}

.alter-ego-visual-target{
  z-index:1;
  visibility:hidden;
}

.alter-ego-visual-sprite{
  z-index:2;
  visibility:hidden;
}

.alter-ego-visual-white{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#fff;
  opacity:0;
  z-index:3;
  pointer-events:none;
}

</style>
</head>
<body>
<div id="welcomeScreen" class="welcome-screen">
  <div class="welcome-box">
    <div class="welcome-message">Seja bem-vindo!</div>

    <button id="welcomeBtn" onclick="enterSite()">OK</button>

  </div>
</div>

<div class="top-bar">

  <div class="site-logo">
    <img src="lobby/logo.png" alt="Santos InforPrint">
  </div>

  <div class="top-controls">

    <div class="icon" id="charactersBtn">👤</div>

    <div class="icon">⚙️</div>

    <div class="icon" id="play">⏯</div>

    <div class="icon" id="extrasBtn">✨</div>

  </div>

  <div class="top-time" id="globalTime">00:00</div>

</div>
<div class="field">
  <div class="player top">

  <div class="character-area">

  <div class="portrait">
    <img id="portrait1" src="">
  </div>

  <button
    class="alter-ego-button"
    id="alterEgoButton1"
    type="button"
  >
    🔁
  </button>

</div>


  <div class="player-panel">

    <div class="info">
      <div class="name" id="name1">Player 1</div>

      <div class="lp-row">
        <span class="lp-label">LP.</span>
        <span class="lp-value" id="lp1">4000</span>
      </div>

      <div class="turn-time">
        <span id="time1">00:00</span>
        <button class="turn-btn" onclick="switchTurn(1)">↻</button>
      </div>
    </div>

    <div class="controls">
      <button class="plus" onclick="openCalc(1,'+')">+</button>
      <button class="minus" onclick="openCalc(1,'-')">−</button>
      <button class="div" onclick="openCalc(1,'/')">÷</button>
      <button class="mult" onclick="openCalc(1,'*')">×</button>
    </div>

  </div>

</div>

<div id="duelResult" class="duel-result"></div>

  <div class="player bottom">

  <div class="character-area">

  <div class="portrait">
    <img id="portrait2" src="">
  </div>

  <button
    class="alter-ego-button"
    id="alterEgoButton2"
    type="button"
  >
    🔁
  </button>

</div>


  <div class="player-panel">

    <div class="info" style="text-align:right">
      <div class="name" id="name2">Player 2</div>

      <div class="lp-row">
        <span class="lp-label">LP.</span>
        <span class="lp-value" id="lp2">4000</span>
      </div>

      <div class="turn-time">
        <button class="turn-btn" onclick="switchTurn(2)">↻</button>
        <span id="time2">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="plus" onclick="openCalc(2,'+')">+</button>
      <button class="minus" onclick="openCalc(2,'-')">−</button>
      <button class="div" onclick="openCalc(2,'/')">÷</button>
      <button class="mult" onclick="openCalc(2,'*')">×</button>
    </div>

  </div>

</div>

</div>

<div class="overlay" id="overlay">
  <div class="calc">
    <input type="number" id="value" placeholder="valor">
    <div><button onclick="applyCalc()">OK</button><button onclick="closeOverlay()">Cancelar</button></div>
  </div>
</div>

<!-- =======================
     PAINEL DE PERSONAGENS
======================= -->

<div id="characterMenu" class="character-menu">

  <div class="character-box">

    <div class="character-tabs">

      <button
        id="characterTabP1"
        class="character-tab active-p1"
        onclick="setCharacterPlayer(0)"
      >
        Player 1
      </button>

      <button
        id="characterTabP2"
        class="character-tab"
        onclick="setCharacterPlayer(1)"
      >
        Player 2
      </button>

    </div>

    <div
      id="characterList"
      class="character-list"
    ></div>

    <div class="character-actions">

      <button onclick="resetCharacters()">
        Resetar
      </button>

      <button onclick="closeCharacterMenu()">
        Fechar
      </button>

    </div>

  </div>

</div>

<!-- =======================
     PAINEL EXTRAS
======================= -->

<div id="extrasMenu" class="extras-menu">

  <div class="extras-box">

    <button type="button">
      Eventos
    </button>

    <button type="button">
      Bônus
    </button>

    <button type="button">
      Resgatar Personagem
    </button>

    <button type="button">
      Roleta de Prêmios
    </button>

    <button type="button">
      Loja
    </button>

    <button type="button">
      Acesso do Desenvolvedor
    </button>

    <button type="button">
      Fechar
    </button>

  </div>

</div>

<!-- =======================
     PAINEL EVENTOS
======================= -->

<div id="eventsMenu" class="events-menu">

  <div class="events-box">

    <div id="eventsList"></div>

    <button type="button" id="eventsCloseButton">
      Fechar
    </button>

  </div>

</div>

<!-- =======================
     DETALHES DO EVENTO
======================= -->

<div id="eventDetailsMenu" class="event-details-menu">

  <div
    id="eventDetailsBox"
    class="event-details-box"
  >

    <div class="event-details-overlay">

      <img
        id="eventDetailsBanner"
        class="event-details-banner"
        src=""
        alt="Banner do evento"
      >

      <div class="event-details-header">

        <div
          id="eventDetailsName"
          class="event-details-name"
        ></div>

        <div
          id="eventDetailsId"
          class="event-details-id"
        ></div>

      </div>

      <div
        id="eventDetailsHistory"
        class="event-details-history"
      ></div>

      <div class="event-details-section-title">
        MISSÕES
      </div>

      <div
        id="eventMissionsList"
        class="event-missions-list"
      ></div>

      <div class="event-details-section-title">
        PRÊMIOS
      </div>

      <div
        id="eventRewardsList"
        class="event-rewards-list"
      ></div>

      <div class="event-redeem-warning">

        <strong>AVISO:</strong><br>

        Para resgatar os prêmios que forem obtidos,
        é necessário utilizar o ID deste evento junto
        às chaves obtidas nos respectivos mecanismos
        de resgate.

      </div>

      <button
        type="button"
        id="eventDetailsCloseButton"
      >
        Fechar
      </button>

    </div>

  </div>

</div>


<script src="personagens.js"></script>
<script src="eventos.js"></script>

<script>
/* =======================
   STORAGE
======================= */
const STORAGE_KEY = "yugioh_lp_hud_v4";

/* =======================
   PROGRESSO DOS EVENTOS
   ETAPA 3
======================= */

const EVENT_PROGRESS_KEY =
  "yugioh_lp_hud_event_progress_v1";

let eventProgress = {};

/* =======================
   MODOS DE DUELO
======================= */

const duelModes = {

  dm: {
    initialLP: 4000,
    timeLimit: null,
    lpSpeed: "normal",
    locked: true
  },

  dl: {
    initialLP: 4000,
    timeLimit: null,
    lpSpeed: "normal",
    locked: false
  },

  tcg: {
    initialLP: 6000,
    timeLimit: 2100,
    lpSpeed: "normal",
    locked: true
  },

  olnd: {
    initialLP: 8000,
    timeLimit: null,
    lpSpeed: "normal",
    locked: true
  },

  custom: {
    initialLP: 4000,
    timeLimit: null,
    lpSpeed: "normal",
    locked: false
  }

};

function applyDuelMode(mode){

  const settings = duelModes[mode];

  if(!settings) return;

  warnReset(()=>{

    state.config.duelMode = mode;

    state.config.initialLP = settings.initialLP;
    state.config.timeLimit = settings.timeLimit;
    state.config.lpSpeed = settings.lpSpeed;

    resetDuel();

    configBtn.onclick();

  });

}

/* =======================
   ESTADO GLOBAL
======================= */
let state = {
  started:false,
starting:false,
running:false,
turn:null,
  globalSec:0,
  overlayMode:null, // null | start | calc | config

    message.style.textAlign = "center";
    message.style.fontWeight = "bold";

button.onclick = () => {

    mode.climax.currentTime = 0;

  });

function playDuelBaseMusic(){

  stopAllDuelMusic();

  const mode = state.config.duelMode;

  const music = duelMusic[mode];

  if(!music) return;

  music.base.currentTime = 0;

  music.base.play().catch(() => {
    console.log("Não foi possível reproduzir a música do duelo.");
  });

  state.musicPhase = "base";

}

function playDuelClimax(){

  if(state.musicPhase === "climax") return;

  if(state.musicPhase === "ended") return;

  const mode = state.config.duelMode;

  const music = duelMusic[mode];

  if(!music) return;

  music.base.pause();
  music.base.currentTime = 0;

  music.climax.currentTime = 0;

  music.climax.play().catch(() => {
    console.log("Não foi possível reproduzir a música de clímax.");
  });

  state.musicPhase = "climax";

}


function checkClimax(){

  if(state.musicPhase !== "base") return;

  const p1LP = state.players[0].lp;
  const p2LP = state.players[1].lp;

  if(p1LP <= 1000 || p2LP <= 1000){
    playDuelClimax();
  }

}



/* =======================
   FALAS DOS PERSONAGENS
======================= */

function playCharacterVoice(
  playerIndex,
  voiceType
){

  return new Promise(resolve => {

    const player =
      state.players[playerIndex];


    /*
      SEM PERSONAGEM

      Na prática isso não deve acontecer
      em um duelo normal, mas evitamos
      travar a sequência.
    */

    if(!player.char){

      resolve();

      return;

    }


    /*
      PEGA O CAMINHO DA FALA
    */

    const voicePath =
      getVoicePath(
        player.char,
        voiceType
      );


    if(!voicePath){

      resolve();

      return;

    }


    /*
      CRIA O ÁUDIO
    */

    const voice =
      new Audio(voicePath);


    /*
      GARANTE QUE A SEQUÊNCIA
      CONTINUE QUANDO A FALA
      TERMINAR
    */

    voice.onended = () => {

      resolve();

    };


    /*
      SE DER ERRO,
      NÃO TRAVA O DUELO
    */

    voice.onerror = () => {

      console.warn(
        "Erro ao reproduzir a fala:",
        voicePath
      );

      resolve();

    };


    /*
      TOCA A FALA
    */

    voice.play().catch(() => {

      console.warn(
        "Não foi possível reproduzir:",
        voicePath
      );

      resolve();

    });

  });

}


/* =======================
   SEQUÊNCIA DE INÍCIO
======================= */

async function playStartVoices(
  startingPlayer
){

  /*
    startingPlayer chega como:
    1 = Player 1
    2 = Player 2

    Transformamos em índice:
    0 = Player 1
    1 = Player 2
  */

  const firstPlayer =
    startingPlayer - 1;


  const secondPlayer =
    firstPlayer === 0
      ? 1
      : 0;


  /*
    PRIMEIRO FALA QUEM
    COMEÇA O DUELO
  */

  await playCharacterVoice(
    firstPlayer,
    "start"
  );


  /*
    DEPOIS FALA O OUTRO
    PERSONAGEM
  */

  await playCharacterVoice(
    secondPlayer,
    "start"
  );

}

/* =======================
   LOAD / SAVE
======================= */
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}


function loadState(){

  const d =
    localStorage.getItem(STORAGE_KEY);


  if(!d){
    return;
  }


  try{

    const savedState =
      JSON.parse(d);


    /*
      MISTURA O ESTADO SALVO
      COM A ESTRUTURA ATUAL
    */

    state = {

      ...state,

      ...savedState,

      config:{

        ...state.config,

        ...(savedState.config || {})

      },

      players:

        Array.isArray(savedState.players)

          ? savedState.players.map(

              (player, index) => ({

                ...state.players[index],

                ...player

              })

            )

          : state.players

    };


  }catch(error){

    console.warn(
      "Estado salvo inválido. Usando estado padrão.",
      error
    );

    localStorage.removeItem(
      STORAGE_KEY
    );

  }


  /*
    GARANTE starting
  */

  if(
    typeof state.starting === "undefined"
  ){

    state.starting = false;

  }


  /*
    GARANTE started
  */

  if(
    typeof state.started === "undefined"
  ){

    state.started = false;

  }


  /*
    GARANTE running
  */

  if(
    typeof state.running === "undefined"
  ){

    state.running = false;

  }


  /*
    GARANTE turn
  */

  if(
    typeof state.turn === "undefined"
  ){

    state.turn = null;

  }


  /*
    GARANTE O RELÓGIO GLOBAL
  */

  if(
    typeof state.globalSec !== "number"
  ){

    state.globalSec = 0;

  }


  /*
    GARANTE musicPhase
  */

  if(
    !state.musicPhase
  ){

    state.musicPhase = "lobby";

  }


  /*
    GARANTE spriteState
  */

  state.players.forEach(
    player => {

      if(!player.spriteState){

        player.spriteState =
          "base";

      }

    }
  );


  /*
    SALVA A ESTRUTURA
    JÁ ATUALIZADA
  */

  saveState();

}

function saveEventProgress(){

  localStorage.setItem(
    EVENT_PROGRESS_KEY,
    JSON.stringify(eventProgress)
  );

}


function loadEventProgress(){

  const saved =
    localStorage.getItem(
      EVENT_PROGRESS_KEY
    );

  if(!saved){

    eventProgress = {};

    return;

  }


  try{

    const parsed =
      JSON.parse(saved);

    if(
      parsed &&
      typeof parsed === "object" &&
      !Array.isArray(parsed)
    ){

      eventProgress = parsed;

    }else{

      eventProgress = {};

    }

  }catch(error){

    console.warn(
      "Progresso dos eventos inválido. O progresso será reiniciado.",
      error
    );

    eventProgress = {};

  }

}


function getEventMissionProgress(
  eventId,
  missionId
){

  if(
    !eventProgress[eventId]
  ){

    return 0;

  }


  const value =
    eventProgress[eventId][missionId];


  if(
    typeof value !== "number" ||
    !Number.isFinite(value)
  ){

    return 0;

  }


  return Math.max(
    0,
    Math.floor(value)
  );

}


/* =======================
   REQUISITOS DOS PRÊMIOS
   ETAPA 4A
======================= */

function isEventMissionCompleted(
  eventId,
  mission
){

  if(
    !mission ||
    !mission.id ||
    !mission.condition
  ){

    return false;

  }

  const target =
    mission.condition.target;

  if(
    typeof target !== "number"
  ){

    return false;

  }

  const progress =
    getEventMissionProgress(
      eventId,
      mission.id
    );

  return progress >= target;

}


function isEventRewardUnlocked(
  event,
  reward
){

  if(
    !event ||
    !reward ||
    !reward.requirement
  ){

    return false;

  }

  const requirement =
    reward.requirement;


  /* =========================
     PELO MENOS X MISSÕES
  ========================= */

  if(
    requirement.type ===
    "missions_completed"
  ){

    if(
      !Array.isArray(
        event.missions
      )
    ){

      return false;

    }

    const requiredAmount =
      Number(
        requirement.amount
      );

    if(
      !Number.isFinite(
        requiredAmount
      )
    ){

      return false;

    }

    const completedAmount =
      event.missions.filter(
        mission =>
          isEventMissionCompleted(
            event.id,
            mission
          )
      ).length;


    return (
      completedAmount >=
      requiredAmount
    );

  }


  /* =========================
     TODAS AS MISSÕES
  ========================= */

  if(
    requirement.type ===
    "all_missions_completed"
  ){

    if(
      !Array.isArray(
        event.missions
      ) ||
      event.missions.length === 0
    ){

      return false;

    }

    return event.missions.every(
      mission =>
        isEventMissionCompleted(
          event.id,
          mission
        )
    );

  }


  /* =========================
     REQUISITO DESCONHECIDO
  ========================= */

  return false;

}

function incrementEventMissionProgress(
  eventId,
  mission,
  amount = 1
){

  if(
    !eventProgress[eventId]
  ){

    eventProgress[eventId] = {};

  }


  const current =
    getEventMissionProgress(
      eventId,
      mission.id
    );


  const target =
    mission.condition &&
    typeof mission.condition.target === "number"
      ? mission.condition.target
      : Infinity;


  const next =
    Math.min(
      current + amount,
      target
    );


  eventProgress[eventId][mission.id] =
    next;


  return next;

}


function eventMissionMatchesDuel(
  condition,
  duelResult
){

  if(
    !condition ||
    !duelResult
  ){

    return false;

  }


  /* =======================
     MISSÃO: DUELO VENCIDO
  ======================= */

  if(
    condition.type === "duel_won"
  ){

    if(
      !duelResult.winner ||
      !duelResult.loser
    ){

      return false;

    }


    /*
      Player específico
    */

    if(
      condition.winnerPlayer &&
      duelResult.winner.player !==
        condition.winnerPlayer
    ){

      return false;

    }


    /*
      Personagem vencedor
    */

    if(
      Array.isArray(
        condition.winnerCharacter
      ) &&
      !condition.winnerCharacter.includes(
        duelResult.winner.characterId
      )
    ){

      return false;

    }


    /*
      Personagem derrotado
    */

    if(
      Array.isArray(
        condition.loserCharacter
      ) &&
      !condition.loserCharacter.includes(
        duelResult.loser.characterId
      )
    ){

      return false;

    }


    /*
      Modo do duelo
    */

    if(
      condition.mode &&
      duelResult.mode !==
        condition.mode
    ){

      return false;

    }


    return true;

  }


  /* =======================
     MISSÃO: DUELO JOGADO
  ======================= */

  if(
    condition.type === "duel_played"
  ){

    const player1 =
      duelResult.players[0];

    const player2 =
      duelResult.players[1];


    /*
      Personagem participante
    */

    if(
      Array.isArray(
        condition.character
      )
    ){

      const characterFound =
        condition.character.includes(
          player1.characterId
        ) ||
        condition.character.includes(
          player2.characterId
        );


      if(!characterFound){

        return false;

      }

    }


    /*
      Adversário específico
    */

    if(
      Array.isArray(
        condition.opponentCharacter
      )
    ){

      const validPair =

        (
          Array.isArray(
            condition.character
          ) &&
          condition.character.includes(
            player1.characterId
          ) &&
          condition.opponentCharacter.includes(
            player2.characterId
          )
        )

        ||

        (
          Array.isArray(
            condition.character
          ) &&
          condition.character.includes(
            player2.characterId
          ) &&
          condition.opponentCharacter.includes(
            player1.characterId
          )
        )

        ||

        (
          !Array.isArray(
            condition.character
          ) &&
          (
            condition.opponentCharacter.includes(
              player1.characterId
            ) ||
            condition.opponentCharacter.includes(
              player2.characterId
            )
          )
        );


      if(!validPair){

        return false;

      }

    }


    /*
      Modo
    */

    if(
      condition.mode &&
      duelResult.mode !==
        condition.mode
    ){

      return false;

    }


    return true;

  }


  return false;

}

function createDuelResult(
  result
){

  const players = [

    {
      player: 1,

      characterId:
        state.players[0].char

    },

    {
      player: 2,

      characterId:
        state.players[1].char

    }

  ];


  if(
    result === "draw"
  ){

    return {

      winner: null,

      loser: null,

      players,

      mode:
        state.config.duelMode,

      duelId:
        `DUEL-${Date.now()}`,

      timestamp:
        Date.now(),

      duelDuration:
        state.globalSec

    };

  }


  const winnerIndex =
    result === "p1"
      ? 0
      : 1;


  const loserIndex =
    result === "p1"
      ? 1
      : 0;


  return {

    winner: {

      player:
        winnerIndex + 1,

      characterId:
        state.players[
          winnerIndex
        ].char

    },


    loser: {

      player:
        loserIndex + 1,

      characterId:
        state.players[
          loserIndex
        ].char

    },


    players,

    mode:
      state.config.duelMode,

    duelId:
      `DUEL-${Date.now()}`,

    timestamp:
      Date.now(),

    duelDuration:
      state.globalSec

  };

}

function processEventDuelResult(
  duelResult
){

  if(
    !duelResult
  ){

    return false;

  }


  if(
    typeof events === "undefined" ||
    !events ||
    typeof events !== "object"
  ){

    return false;

  }


  let progressChanged =
    false;


  Object.values(events).forEach(
    event => {

      /*
        EVENTOS INTERNOS NÃO
        PARTICIPAM DO PROGRESSO
      */

      if(
        !event ||
        event.internalEvent === true ||
        !Array.isArray(event.missions)
      ){

        return;

      }


      event.missions.forEach(
        mission => {

          if(
            !mission ||
            !mission.id ||
            !mission.condition
          ){

            return;

          }


          const current =
            getEventMissionProgress(
              event.id,
              mission.id
            );


          const target =
            mission.condition.target;


          /*
            MISSÃO JÁ CONCLUÍDA
          */

          if(
            typeof target === "number" &&
            current >= target
          ){

            return;

          }


          /*
            VERIFICA A CONDIÇÃO
          */

          const matches =
            eventMissionMatchesDuel(
              mission.condition,
              duelResult
            );


          if(!matches){

            return;

          }


          /*
            INCREMENTA
          */

          incrementEventMissionProgress(
            event.id,
            mission,
            1
          );


          progressChanged =
            true;

        }
      );

    }
  );


  if(progressChanged){

    saveEventProgress();

  }


  return progressChanged;

}

function lpPerSecond(){
  if(state.config.lpSpeed==="slow") return 100;
  if(state.config.lpSpeed==="normal") return 250;
  return 600;
}

function animateLP(el, from, to, onComplete){

  if(from === to){
    el.textContent = to;

    if(onComplete){
      onComplete();
    }

    return;
  }

  const diff = Math.abs(to - from);
  const dur = (diff / lpPerSecond()) * 1000;
  const start = performance.now();

  function step(t){
    const progress = Math.min((t - start) / dur, 1);

    el.textContent = Math.round(
      from + (to - from) * progress
    );

    if(progress < 1){
      requestAnimationFrame(step);
    } else {
      el.textContent = to;

      if(onComplete){
        onComplete();
      }
    }
  }

  requestAnimationFrame(step);
}

async function playEndVoices(result){

    EMPATE

    Não existe vitória nem derrota.
    Portanto, nenhuma fala é tocada.
  */

  if(result === "draw"){
    return;
  }


  /*
    PLAYER 1 VENCEU
  */

  if(result === "p1"){

    /* PRIMEIRO A VITÓRIA */

    await playCharacterVoice(
      0,
      "victory"
    );


    /* DEPOIS A DERROTA */

    await playCharacterVoice(
      1,
      "defeat"
    );

    return;

  }


  /*
    PLAYER 2 VENCEU
  */

  if(result === "p2"){

    /* PRIMEIRO A VITÓRIA */

    await playCharacterVoice(
      1,
      "victory"
    );


    /* DEPOIS A DERROTA */

    await playCharacterVoice(
      0,
      "defeat"
    );

  }

}

  /*

  ){

  state.turn = null;


  /*

       DE QUALQUER CALLBACK TEMPORÁRIO
       CONSEGUIR INTERFERIR
  */

  state.musicPhase = "ended";


  /*
    3. PARA TODA A SONOPLASTIA DO DUELO
  */

  stopAllDuelMusic();


  /*
    4. DEFINE O RESULTADO
  */

  let message = "Empate!";

  let result = "draw";


  if(
    state.players[0].lp >
    state.players[1].lp
  ){

    result = "p1";

    message =
      getPlayerDisplayName(0) +
      " venceu!";

  }


  if(
    state.players[1].lp >
    state.players[0].lp
  ){

    result = "p2";

    message =
      getPlayerDisplayName(1) +
      " venceu!";

  }


  /*
    5. PRIORIDADE MÁXIMA:
       APLICA OS SPRITES FINAIS
  */

  applyFinalSpriteStates(result);


  /*
    6. EXIBE O RESULTADO
  */

  showDuelResult(message);

const duelResult =
  createDuelResult(result);

processEventDuelResult(
  duelResult
);


  /*
    7. SALVA O ESTADO FINAL
  */

  saveState();




/*
  8. TOCA AS FALAS FINAIS

  A vitória sempre vem antes
  da derrota.

  Em caso de empate,
  playEndVoices() não toca nada.
*/

await playEndVoices(result);

}

const VOICE_TYPES = [
  "start",
  "heal",
  "damage",
  "victory",
  "defeat"
];

function getVoicePath(characterId, voiceType){

  if(!characterId){
    return null;
  }

  if(!VOICE_TYPES.includes(voiceType)){
    return null;
  }

  return `falas/${characterId}_${voiceType}.mp3`;

}

function getCharacterVoices(characterId){

  if(!characterId){
    return null;
  }

  return {

    start:
      getVoicePath(
        characterId,
     "start"
      ),

    heal:
      getVoicePath(
        characterId,
        "heal"
      ),

    damage:
      getVoicePath(
        characterId,
        "damage"
      ),

    victory:
      getVoicePath(
        characterId,
        "victory"
      ),

    defeat:
      getVoicePath(
        characterId,
        "defeat"
      )

  };

}

function checkVoice(path){

  return new Promise(resolve => {

    const audio =
      new Audio();

    audio.preload = "metadata";

    audio.onloadedmetadata = () => {

      cleanup();

      resolve(true);

    };

    audio.onerror = () => {

      cleanup();

      resolve(false);

    };

    function cleanup(){

      audio.onloadedmetadata = null;
      audio.onerror = null;

    }

    audio.src = path;

    audio.load();

  });

}

async function validateCharacterVoices(characterId){

  const voices =
    getCharacterVoices(characterId);

  if(!voices){
    return false;
  }


  const results =
    await Promise.all(

      Object.values(voices).map(
        path => checkVoice(path)
      )

    );


  return results.every(
    exists => exists === true
  );

}

    const audio = new Audio();

    audio.preload = "metadata";

    audio.onloadedmetadata = () => {
      cleanup();
      resolve(true);
    };

    audio.onerror = () => {
      cleanup();
      resolve(false);
    };

    function cleanup(){
      audio.onloadedmetadata = null;
      audio.onerror = null;
    }

    audio.src = path;
    audio.load();
  });
}

async function validateAlterEgoResources(characterId){
  if(!characterId) return false;

  const spritePath = getAlterEgoSpritePath(characterId);
  const audioPath = getAlterEgoAudioPath(characterId);

  const [hasSprite, hasAudio] = await Promise.all([
    checkAlterEgoSprite(spritePath),
    checkAlterEgoAudio(audioPath)
  ]);

  return hasSprite && hasAudio;
}



function createAlterEgoVisual(
  playerIndex,
  currentCharacterId,
  targetCharacterId
){

  const portrait =
    playerIndex === 0
      ? portrait1El
      : portrait2El;

  if(!portrait){
    return null;
  }

  const portraitBox =
    portrait.parentElement;

  if(!portraitBox){
    return null;
  }

  const oldLayer =
    portraitBox.querySelector(
      ".alter-ego-visual"
    );

  if(oldLayer){
    oldLayer.remove();
  }

  const layer =
    document.createElement("div");

  layer.className =
    "alter-ego-visual";

  layer.style.visibility =
    "hidden";


  /* PERSONAGEM DESTINO */

  const targetImg =
    document.createElement("img");

  targetImg.className =
    "alter-ego-visual-target";

  targetImg.src =
    getSpritePath(
      targetCharacterId,
      "base"
    );


  /* ALTER EGO */

  const alterImg =
    document.createElement("img");

  alterImg.className =
    "alter-ego-visual-sprite";

  alterImg.src =
    getAlterEgoSpritePath(
      currentCharacterId
    );


  /* CAMADA BRANCA */

  const whiteLayer =
    document.createElement("div");

  whiteLayer.className =
    "alter-ego-visual-white";

  whiteLayer.style.opacity = "0";


  layer.appendChild(targetImg);
  layer.appendChild(alterImg);
  layer.appendChild(whiteLayer);

  portraitBox.appendChild(layer);


  return {
    layer,
    targetImg,
    alterImg,
    whiteLayer
  };
}


function removeAlterEgoVisual(
  animation
){

  if(
    !animation ||
    !animation.visual
  ){
    return;
  }

  const layer =
    animation.visual.layer;

  if(
    layer &&
    layer.parentNode
  ){
    layer.remove();
  }
}

/* =======================
   MOTOR ALTER EGO
   ETAPA 3A — TEMPO
======================= */

function startAlterEgoTransformation(playerIndex){

  if(
    playerIndex !== 0 &&
    playerIndex !== 1
  ){
    return;
  }

  const player =
    state.players[playerIndex];

  if(!player.char){
    return;
  }

  const currentCharacterId =
    player.char;

  if(
    typeof characters === "undefined" ||
    !characters[currentCharacterId]
  ){
    return;
  }

  const character =
    characters[currentCharacterId];

  if(!character.switchId){
    return;
  }

  if(alterEgoAnimation){
    return;
  }


  /* =========================
     CRIA CAMADA VISUAL
     ========================= */

  const visual =
    createAlterEgoVisual(
      playerIndex,
      currentCharacterId,
      character.switchId
    );


  const startTime =
    performance.now();


  alterEgoAnimation = {

    playerIndex,

    startTime,

    currentCharacterId,

    targetCharacterId:
      character.switchId,

    switched:false,

    phase:null,

    visual

  };


  /* =========================
     ÁUDIO ALTER EGO
     ========================= */

  const audioPath =
    getAlterEgoAudioPath(
      currentCharacterId
    );

  if(audioPath){

    const audio =
      new Audio(audioPath);

    audio.currentTime = 0;

    audio.play().catch(() => {

      console.warn(
        "Não foi possível reproduzir o áudio Alter Ego:",
        audioPath
      );

    });

  }


  requestAnimationFrame(
    updateAlterEgoTransformation
  );
}


function updateAlterEgoTransformation(timestamp){

  if(!alterEgoAnimation){
    return;
  }


  const animation =
    alterEgoAnimation;


  const elapsed =
    (timestamp - animation.startTime) / 1000;


  const visual =
    animation.visual;


  let phase = null;


  /* =========================
     FASES
     ========================= */

  if(elapsed < 4){

    phase = "WAIT";

  }
  else if(elapsed < 9){

    phase = "COVER";

  }
  else if(elapsed < 10){

    phase = "FULL_WHITE";

  }
  else if(elapsed < 11){

    phase = "HIDDEN_SWITCH";

  }
  else if(elapsed < 21){

    phase = "REVEAL";

  }
  else{

    phase = "COMPLETE";

  }


  /* =========================
     LOG DA FASE
     ========================= */

  if(
    phase !== animation.phase
  ){

    animation.phase =
      phase;

    console.log(
      "ALTER EGO — fase:",
      phase,
      "| tempo:",
      elapsed.toFixed(3),
      "s"
    );

  }


  /* =========================
     0s → 4s
     PERSONAGEM NORMAL
     ========================= */

  if(elapsed < 4){

setNormalPortraitVisibility(
  animation.playerIndex,
  true
);

    if(visual){

      visual.layer.style.visibility =
        "hidden";

      visual.alterImg.style.visibility =
        "hidden";

      visual.targetImg.style.visibility =
        "hidden";

      visual.whiteLayer.style.opacity =
        "0";
    }

  }


  /* =========================
     4s → 9s
     ALTER EGO + BRANCO
     ========================= */

  else if(elapsed < 9){

setNormalPortraitVisibility(
  animation.playerIndex,
  false
);

    if(visual){

      visual.layer.style.visibility =
        "visible";

      visual.alterImg.style.visibility =
        "visible";

      visual.targetImg.style.visibility =
        "hidden";


      const progress =
        (elapsed - 4) / 5;


      visual.whiteLayer.style.opacity =
        String(
          Math.min(
            1,
            Math.max(
              0,
              progress
            )
          )
        );

    }

  }


  /* =========================
     9s → 10s
     BRANCO TOTAL
     ========================= */

  else if(elapsed < 10){

setNormalPortraitVisibility(
  animation.playerIndex,
  false
);

    if(visual){

      visual.layer.style.visibility =
        "visible";

      visual.alterImg.style.visibility =
        "visible";

      visual.targetImg.style.visibility =
        "hidden";

      visual.whiteLayer.style.opacity =
        "1";

    }

  }


  /* =========================
     10s → 11s
     TROCA ESCONDIDA
     ========================= */

  else if(elapsed < 11){
    if(visual){

      visual.layer.style.visibility =
        "visible";

      visual.alterImg.style.visibility =
        "visible";

      visual.targetImg.style.visibility =
        "hidden";

      visual.whiteLayer.style.opacity =
        "1";

    }

  }


  /* =========================
     TROCA LÓGICA
     EXATAMENTE A PARTIR DE 10s
     ========================= */

  if(
    elapsed >= 10 &&
    !animation.switched
  ){

    animation.switched =
      true;


    const player =
      state.players[
        animation.playerIndex
      ];


    player.char =
      animation.targetCharacterId;

    player.spriteState =
      "base";


    /*
      O sprite normal é trocado
      enquanto a tela ainda está
      completamente branca.
    */

    renderPlayerSprite(
      animation.playerIndex
    );


    saveState();


    console.log(
      "ALTER EGO — ponto de troca lógica atingido:",
      elapsed.toFixed(3),
      "s"
    );

  }


  /* =========================
     11s → 21s
     REVELAÇÃO
     ========================= */

  if(
    elapsed >= 11 &&
    elapsed < 21
  ){

    if(visual){

      visual.layer.style.visibility =
        "visible";


      /*
        O Alter Ego desaparece
        antes da revelação.
      */

      visual.alterImg.style.visibility =
        "hidden";


      /*
        O personagem destino
        fica preparado por baixo.
      */

      visual.targetImg.style.visibility =
        "visible";


      /*
        Branco:
        100% → 0%
      */

      const progress =
        (elapsed - 11) / 10;


      const opacity =
        1 - progress;


      visual.whiteLayer.style.opacity =
        String(
          Math.min(
            1,
            Math.max(
              0,
              opacity
            )
          )
        );

    }

  }


  /* =========================
     21s
     FINALIZAÇÃO
     ========================= */

  if(elapsed >= 21){

setNormalPortraitVisibility(
  animation.playerIndex,
  true
);

    if(visual){

      visual.whiteLayer.style.opacity =
        "0";

    }


    /*
      Garante que o estado normal
      continue mostrando o novo personagem.
    */

    renderPlayerSprite(
      animation.playerIndex
    );


    /*
      Agora sim removemos toda
      a camada temporária.
    */

    removeAlterEgoVisual(
      animation
    );


    renderPlayerNames();


    updateAlterEgoButtons();


    saveState();


    console.log(
      "ALTER EGO — transformação concluída em:",
      elapsed.toFixed(3),
      "s"
    );


    alterEgoAnimation =
      null;

    return;
  }


  requestAnimationFrame(
    updateAlterEgoTransformation
  );
}



function setAlterEgoButtonState(button, visible, disabled = false){
  if(!button) return;

  if(!visible){
    button.classList.add("hidden");
    button.disabled = true;
    return;
  }

  button.classList.remove("hidden");

  if(disabled){
    button.disabled = true;
    button.style.opacity = "0.45";
    button.style.cursor = "not-allowed";
  }else{
    button.disabled = false;
    button.style.opacity = "1";
    button.style.cursor = "pointer";
  }
}


function setNormalPortraitVisibility(
  playerIndex,
  visible
){

  const portrait =
    playerIndex === 0
      ? portrait1El
      : portrait2El;

  if(!portrait){
    return;
  }

  portrait.style.visibility =
    visible ? "visible" : "hidden";
}



async function updateAlterEgoButtons(){

  const player1CharacterId = state.players[0].char;
  const player2CharacterId = state.players[1].char;

  // Começa sempre escondendo os dois.
  setAlterEgoButtonState(alterEgoButton1El, false);
  setAlterEgoButtonState(alterEgoButton2El, false);

  // Sem personagens, não há Alter Ego para verificar.
  if(!player1CharacterId && !player2CharacterId){
    return;
  }

  let player1Character = null;
  let player2Character = null;

  if(typeof characters !== "undefined"){
    player1Character = player1CharacterId
      ? characters[player1CharacterId]
      : null;

    player2Character = player2CharacterId
      ? characters[player2CharacterId]
      : null;
  }

  /*
   * Verifica se os dois jogadores estão usando
   * personagens pertencentes ao mesmo Alter Ego.
   *
   * null não pode gerar conflito.
   */
  const sameAlterEgo =
    player1Character &&
    player2Character &&
    player1Character.alterEgoId &&
    player2Character.alterEgoId &&
    player1Character.alterEgoId === player2Character.alterEgoId;

  // =========================
  // JOGADOR 1
  // =========================

  if(
    player1Character &&
    player1Character.alterEgo === true
  ){

    const hasResources =
      await validateAlterEgoResources(player1CharacterId);

    if(hasResources){

      setAlterEgoButtonState(
        alterEgoButton1El,
        true,
        sameAlterEgo
      );

    }
  }

  // =========================
  // JOGADOR 2
  // =========================

  if(
    player2Character &&
    player2Character.alterEgo === true
  ){

    const hasResources =
      await validateAlterEgoResources(player2CharacterId);

    if(hasResources){

      setAlterEgoButtonState(
        alterEgoButton2El,
        true,
        sameAlterEgo
      );

    }
  }
}



function renderPlayerSprite(playerIndex){

  const player = state.players[playerIndex];

  const portrait =
    playerIndex === 0
      ? portrait1El
      : portrait2El;


  /* SEM PERSONAGEM */

  if(!player.char){

    portrait.removeAttribute("src");

    return;

  }


  /* DEFINE O CAMINHO */

  const spritePath =
    getSpritePath(
      player.char,
      player.spriteState
    );


  if(!spritePath){

    portrait.removeAttribute("src");

    return;

  }


  portrait.src = spritePath;

}

function setPlayerSpriteState(
  playerIndex,
  spriteState
){

  const player =
    state.players[playerIndex];


  if(!SPRITE_TYPES.includes(spriteState)){
    return;
  }


  player.spriteState =
    spriteState;


  renderPlayerSprite(playerIndex);

}


function renderAllPlayerSprites(){

  renderPlayerSprite(0);

  renderPlayerSprite(1);

}


function showTemporarySprite(playerIndex, spriteType){

  const player = state.players[playerIndex];

  if(!player.char) return;

  if(!SPRITE_TYPES.includes(spriteType)){
    return;
  }

  setPlayerSpriteState(
    playerIndex,
    spriteType
  );

}

function isDuelEnded(){

  return state.musicPhase === "ended";

}

function restoreBaseSprite(playerIndex){

  /*
    ESTADO FINAL TEM PRIORIDADE MÁXIMA.

    Se o duelo terminou, nenhum callback
    temporário pode restaurar o sprite base.
  */

  if(isDuelEnded()){
    return;
  }


  const player =
    state.players[playerIndex];


  if(!player.char){
    return;
  }


  setPlayerSpriteState(
    playerIndex,
    "base"
  );

}

function applyFinalSpriteStates(result){

  /*
    RESULTADOS POSSÍVEIS:

    p1 → Player 1 venceu
    p2 → Player 2 venceu
    draw → Empate
  */


  /* PLAYER 1 VENCEU */

  if(result === "p1"){

    setPlayerSpriteState(
      0,
      "victory"
    );

    setPlayerSpriteState(
      1,
      "defeat"
    );

    return;
  }


  /* PLAYER 2 VENCEU */

  if(result === "p2"){

    setPlayerSpriteState(
      0,
      "defeat"
    );

    setPlayerSpriteState(
      1,
      "victory"
    );

    return;
  }


  /*
    EMPATE

    Nenhum jogador venceu ou perdeu.
    Os dois retornam ao estado neutro.
  */

  setPlayerSpriteState(
    0,
    "base"
  );

  setPlayerSpriteState(
    1,
    "base"
  );

}


function playActionSprite(playerIndex, action){

  let spriteType = "base";

  if(action === "heal"){
    spriteType = "heal";
  }

  if(action === "damage"){
    spriteType = "damage";
  }

  showTemporarySprite(
    playerIndex,
    spriteType
  );

  setTimeout(() => {

    /*
      Se o duelo já terminou,
      não volta para o sprite base.
    */

    if(isDuelEnded()){
  return;
}

    restoreBaseSprite(playerIndex);

  }, 1200);

}

/* =======================
   SISTEMA DE PERSONAGENS
======================= */

const charactersBtn = document.getElementById("charactersBtn");

const characterMenu = document.getElementById("characterMenu");

const characterTabP1 = document.getElementById("characterTabP1");
const characterTabP2 = document.getElementById("characterTabP2");

const characterList = document.getElementById("characterList");

let activeCharacterPlayer = 0;
let characterMenuRenderId = 0;
/* =======================
   MOTOR ALTER EGO
======================= */

let alterEgoAnimation = null;

/* =======================
   ABRIR PAINEL
======================= */

charactersBtn.onclick = () => {

  activeCharacterPlayer = 0;

  renderCharacterMenu();

  characterMenu.style.display = "flex";

};


/* =======================
   FECHAR PAINEL
======================= */

function closeCharacterMenu(){

  characterMenu.style.display = "none";

}


/* =======================
   TROCAR PLAYER ATIVO
======================= */

function setCharacterPlayer(playerIndex){

  activeCharacterPlayer = playerIndex;

  renderCharacterMenu();

}


/* =======================
   RENDERIZAR PAINEL
======================= */

async function renderCharacterMenu(){

  /*
    Cada chamada recebe um ID próprio.

    Se outra renderização começar depois,
    esta deixa de ter permissão para alterar
    a lista.
  */

  const renderId =
    ++characterMenuRenderId;


  const p1Char =
    state.players[0].char;

  const p2Char =
    state.players[1].char;


  /* =========================
     PLAYER ATIVO
     ========================= */

  characterTabP1.classList.remove("active-p1");
  characterTabP1.classList.remove("active-p2");

  characterTabP2.classList.remove("active-p1");
  characterTabP2.classList.remove("active-p2");


  if(activeCharacterPlayer === 0){

    characterTabP1.classList.add("active-p1");

  }else{

    characterTabP2.classList.add("active-p2");

  }


  /* =========================
     NOMES DAS ABAS
     ========================= */

  characterTabP1.textContent =
    p1Char &&
    typeof characters !== "undefined" &&
    characters[p1Char]
      ? characters[p1Char].name
      : "Player 1";


  characterTabP2.textContent =
    p2Char &&
    typeof characters !== "undefined" &&
    characters[p2Char]
      ? characters[p2Char].name
      : "Player 2";


  /* =========================
     LISTA
     ========================= */

  characterList.innerHTML = "";


  if(typeof characters === "undefined"){

    characterList.innerHTML =
      "<div>Nenhum personagem disponível.</div>";

    return;

  }


  /*
    FRAGMENTO TEMPORÁRIO

    Os personagens serão montados aqui
    e só depois enviados para a lista.
  */

  const fragment =
    document.createDocumentFragment();


  for(const character of Object.values(characters)){

    /*
      Se outra renderização começou
      enquanto estávamos lendo os arquivos,
      esta renderização perdeu a prioridade.
    */

    if(renderId !== characterMenuRenderId){
      return;
    }


    /* =========================
       VALIDAÇÃO DOS SPRITES
       ========================= */

    const hasValidSprites =
      await validateCharacterSprites(
        character.id
      );


    /*
      Durante o await outra renderização
      pode ter começado.
    */

    if(renderId !== characterMenuRenderId){
      return;
    }


    if(!hasValidSprites){
      continue;
    }


    /* =========================
       VALIDAÇÃO DAS FALAS
       ========================= */

    const hasValidVoices =
      await validateCharacterVoices(
        character.id
      );


    /*
      Verifica novamente depois
      da leitura dos áudios.
    */

    if(renderId !== characterMenuRenderId){
      return;
    }


    if(!hasValidVoices){
      continue;
    }


    /* =========================
       PERSONAGEM VÁLIDO
       ========================= */

    const button =
      document.createElement("button");


    button.className =
      "character-option";


    button.textContent =
      character.name;


    const selectedByP1 =
      p1Char === character.id;


    const selectedByP2 =
      p2Char === character.id;


    /* =========================
       COR DA SELEÇÃO
       ========================= */

    if(selectedByP1){

      button.classList.add(
        "selected-p1"
      );

    }


    if(selectedByP2){

      button.classList.add(
        "selected-p2"
      );

    }


    /* =========================
       BLOQUEIO
       ========================= */

    const usedByOtherPlayer =
      activeCharacterPlayer === 0
        ? selectedByP2
        : selectedByP1;


    if(usedByOtherPlayer){

      button.classList.add(
        "disabled"
      );

      button.disabled = true;

    }


    /* =========================
       CLIQUE
       ========================= */

    button.onclick = () => {

      selectCharacter(
        character.id
      );

    };


    /*
      Ainda não coloca diretamente
      no DOM.

      Primeiro termina a montagem.
    */

    fragment.appendChild(
      button
    );

  }


  /*
    SEGURANÇA FINAL

    Só a renderização mais recente
    pode substituir a lista.
  */

  if(renderId !== characterMenuRenderId){
    return;
  }


  characterList.innerHTML = "";

  characterList.appendChild(
    fragment
  );

}
/* =======================
   SELECIONAR PERSONAGEM
======================= */

async function selectCharacter(characterId){

  const otherPlayer =
    activeCharacterPlayer === 0 ? 1 : 0;


  /*
    SEGURANÇA:
    IMPEDE PERSONAGEM DUPLICADO
  */

  if(
    state.players[otherPlayer].char === characterId
  ){
    return;
  }


  /*
    5.7 — VALIDAÇÃO FINAL

    Mesmo que alguém tente selecionar
    o personagem por outro caminho,
    ele precisa possuir o pacote visual
    completo.
 */

const hasValidSprites =
  await validateCharacterSprites(
    characterId
  );


if(!hasValidSprites){

  console.warn(
    "Personagem inválido: pacote visual incompleto."
  );

  return;

}


const hasValidVoices =
  await validateCharacterVoices(
    characterId
  );


if(!hasValidVoices){

  console.warn(
    "Personagem inválido: pacote de falas incompleto."
  );

  return;

}


  /*
    PERSONAGEM VALIDADO
  */

  state.players[activeCharacterPlayer].char =
    characterId;


  state.players[activeCharacterPlayer].spriteState =
    "base";


  saveState();


  renderPlayerNames();


  renderCharacterMenu();


  renderPlayerSprite(
    activeCharacterPlayer
  );
updateAlterEgoButtons();

}


/* =======================
   RESETAR PERSONAGENS
======================= */

function resetCharacters(){

  state.players[0].char = null;
state.players[0].spriteState = "base";

state.players[1].char = null;
state.players[1].spriteState = "base";


  saveState();

  renderPlayerNames();
renderAllPlayerSprites();
updateAlterEgoButtons();

  activeCharacterPlayer = 0;

  renderCharacterMenu();

}
